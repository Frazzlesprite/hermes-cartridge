name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build, test, verify bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The Desktop loader executes the committed file, so a stale bundle is a
      # silent lie: the repo would describe code the app never runs.
      - name: The committed bundle matches a fresh build
        run: git diff --exit-code --stat -- desktop/plugin.js

      # Headless: no Electron, no canvas, no network. Includes the golden
      # framebuffer hash, the save-state round trip and the render smoke tests.
      - name: Test
        run: npm test

      - name: plugin.yaml stays truthful
        run: node tools/check-manifest.mjs

      # Rule 17: everything a reviewer reads at the pin must be source. Running
      # the plugin locally leaves __pycache__ behind; it must never be committed.
      - name: No committed bytecode or binaries
        run: |
          if git ls-files | grep -Eq '(\.pyc|\.pyo)$|^__pycache__/'; then
            echo "committed Python bytecode:"
            git ls-files | grep -E '(\.pyc|\.pyo)$|^__pycache__/'
            exit 1
          fi
          echo "no committed bytecode"

      # The self-test ROM is a binary the scanner reads; its provenance lives in
      # the repo. If the bytes change, the golden hash and this check both move.
      - name: Self-test ROM matches its recorded hash
        run: node tools/check-selftest.mjs
