name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build, test, verify bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The Desktop loader executes the committed file, so a stale bundle is a
      # silent lie: the repo would describe code the app never runs.
      - name: The committed bundle matches a fresh build
        run: git diff --exit-code --stat -- desktop/plugin.js

      # Headless: no Electron, no canvas, no network. Includes the golden
      # framebuffer hash, the save-state round trip and the render smoke tests.
      - name: Test
        run: npm test

      - name: plugin.yaml stays truthful
        run: |
          node -e "
            const fs = require('fs');
            const yaml = fs.readFileSync('plugin.yaml', 'utf8');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = yaml.match(/^version:\s*(\S+)/m)[1];
            if (version !== pkg.version) {
              console.error('plugin.yaml version', version, '!= package.json', pkg.version);
              process.exit(1);
            }
            if (!/^requires_hermes:\s*">=[0-9]+\.[0-9]+\.[0-9]+"/m.test(yaml)) {
              console.error('requires_hermes must be a SemVer floor');
              process.exit(1);
            }
            console.log('manifest consistent:', version);
          "

      # Rule 17: everything a reviewer reads at the pin must be source. Running
      # the plugin locally leaves __pycache__ behind; it must never be committed.
      - name: No committed bytecode or binaries
        run: |
          if git ls-files | grep -Eq '(\.pyc|\.pyo)$|^__pycache__/'; then
            echo "committed Python bytecode:"
            git ls-files | grep -E '(\.pyc|\.pyo)$|^__pycache__/'
            exit 1
          fi
          echo "no committed bytecode"

      # The self-test ROM is a binary the scanner reads; its provenance lives in
      # the repo. If the bytes change, the golden hash and this check both move.
      - name: Self-test ROM matches its recorded hash
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const expected = '275705265cc8dd3d6c15bff07b136c2654a42da5a06664116a0800ce96c1dc00';
            const actual = crypto.createHash('sha256').update(fs.readFileSync('roms/selftest.gb')).digest('hex');
            if (actual !== expected) {
              console.error('roms/selftest.gb changed:', actual);
              process.exit(1);
            }
            console.log('selftest.gb sha256 ok');
          "
